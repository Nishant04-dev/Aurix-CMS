# ============================================================
# Nginx config for Aurix backend
# Place at: /etc/nginx/sites-available/aurix-api
# Symlink:  ln -s /etc/nginx/sites-available/aurix-api /etc/nginx/sites-enabled/
# ============================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name api.aurixcloud.in;
    return 301 https://$host$request_uri;
}

# HTTPS — proxy to Node backend
server {
    listen 443 ssl http2;
    server_name api.aurixcloud.in;

    # SSL — Certbot will fill these in automatically
    # Run: certbot --nginx -d api.aurixcloud.in
    ssl_certificate     /etc/letsencrypt/live/api.aurixcloud.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aurixcloud.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;

    # Proxy to Node.js
    location / {
        proxy_pass         http://127.0.0.1:25569;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
